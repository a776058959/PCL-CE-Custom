name: Custom build

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 tag 或分支（留空 = 最新正式发版）'
        type: string
        required: false
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: custom-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/PCL-Community/PCL-CE.git

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.up.outputs.ref }}
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - name: Resolve upstream ref
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$WANT" ]; then
            ref="$WANT"
          else
            ref=$(gh api repos/PCL-Community/PCL-CE/releases/latest --jq .tag_name)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "upstream ref: $ref"

      - name: Compare with existing builds
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.up.outputs.ref }}
        run: |
          hits=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].body' 2>/dev/null \
            | grep -cF "<!-- upstream:$REF -->" || true)
          if [ "${hits:-0}" -gt 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "$REF 已经构建过，跳过"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "$REF 还没构建过，开始"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at ref
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -e
          git clone --depth 1 --branch "$REF" "$UPSTREAM_REPO" src
          cd src
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF=$REF" >> "$GITHUB_ENV"
          case "$REF" in
            v*) echo "TAG=custom-$REF" >> "$GITHUB_ENV" ;;
            *)  echo "TAG=custom-$REF-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV" ;;
          esac
          echo "upstream: $REF $(git log -1 --format=%h\ %s)"

      - name: Apply patches
        working-directory: src
        run: |
          set -e
          for p in ../patches/*.patch; do
            echo "applying $p"
            git apply --verbose "$p"
          done

      - name: Verify patches still cover every gate
        working-directory: src
        run: |
          set -e
          grep -q 'local-build-unrestricted' 'Plain Craft Launcher 2/Modules/Minecraft/RestrictedFeaturePolicy.cs' \
            || { echo '::error::region gate patch did not land'; exit 1; }
          grep -q '"SystemSystemUpdate", LauncherAutoUpdateBehavior.Disable' PCL.Core/App/Config.cs \
            || { echo '::error::auto-update default patch did not land'; exit 1; }
          n=$(grep -rn 'RegionPolicy\.Evaluate(' --include=*.cs . | grep -v '^\./PCL.Core.Test/' | wc -l)
          [ "$n" -eq 0 ] || { echo "::error::upstream added RegionPolicy.Evaluate call site(s) outside tests: $n"; exit 1; }
          grep -q 'McDownloadClient(' 'Plain Craft Launcher 2/Pages/PageDownload/ModDownloadLib.cs' \
            || { echo '::error::download entry point is gone upstream'; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: src
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ env.UPSTREAM_SHA }}
        run: |
          set -e
          dotnet publish 'Plain Craft Launcher 2/Plain Craft Launcher 2.csproj' \
            -p:Configuration=CI -p:Platform=x64 --self-contained true -o ../artifact

      - name: Stage artifact
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          set -e
          mkdir -p dist
          cp 'artifact/Plain Craft Launcher 2.exe' dist/PCL-CE-Custom-x64.exe
          ls -lh dist
          if [ -n "$CLIENT_ID" ]; then echo 'CLIENT_ID: set'; else echo 'CLIENT_ID: not set'; fi
          if [ -n "$CLIENT_ID" ]; then
            strings -el dist/PCL-CE-Custom-x64.exe | grep -qF "$CLIENT_ID" \
              && echo 'client id found in binary' \
              || echo '::warning::CLIENT_ID 已配置但未在产物中找到，检查 PCL_WRITE_SECRET 与 env 变量名'
          fi
          {
            echo "基于上游 \`$UPSTREAM_REF\` 构建，已解除区域限制并默认关闭自动检查更新。"
            echo
            echo "- 上游版本：\`$UPSTREAM_REF\`"
            echo "- 上游提交：\`$(echo $UPSTREAM_SHA | cut -c1-7)\`"
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 补丁：$(ls patches | tr '\n' ' ')"
            echo
            echo "<!-- upstream:$UPSTREAM_REF -->"
          } > body.md
          cat body.md

      - uses: actions/upload-artifact@v4
        with:
          name: PCL-CE-Custom-x64
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: body.md
          files: dist/PCL-CE-Custom-x64.exe
          make_latest: true

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt > rels.json
          python3 - <<'PY' > delete.txt
          import json, datetime
          rels = json.load(open('rels.json'))
          now = datetime.datetime.now(datetime.timezone.utc)
          cut = now - datetime.timedelta(days=30)
          keep, months = set(), {}
          for r in rels:
              t = datetime.datetime.fromisoformat(r['publishedAt'].replace('Z', '+00:00'))
              if t >= cut:
                  keep.add(r['tagName'])
              else:
                  months.setdefault(t.strftime('%Y-%m'), []).append((t, r['tagName']))
          for items in months.values():
              items.sort()
              keep.add(items[-1][1])
          for r in rels:
              if r['tagName'] not in keep:
                  print(r['tagName'])
          PY
          echo '--- to delete ---'
          cat delete.txt
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < delete.txt