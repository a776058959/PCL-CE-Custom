name: Custom build

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 tag 或分支（留空 = 最新正式发版）'
        type: string
        required: false
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/upstream-lock.txt'

permissions:
  contents: write

concurrency:
  group: custom-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/PCL-Community/PCL-CE.git
  UPSTREAM_SLUG: PCL-Community/PCL-CE

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.cmp.outputs.ref }}
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # 判定依据是仓库里的 .github/upstream-lock.txt（上次成功构建的上游 tag），
      # 不依赖 release 列表，也不会被保留策略清理掉。
      - name: Compare upstream release tag with lock file
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.ref }}
        run: |
          set -e
          if [ -n "$WANT" ]; then
            ref="$WANT"
          else
            ref=$(gh api "repos/$UPSTREAM_SLUG/releases/latest" --jq .tag_name)
          fi
          locked=$(tr -d '[:space:]' < .github/upstream-lock.txt 2>/dev/null || true)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "上游目标: $ref"
          echo "上次构建: ${locked:-（无记录）}"
          case "$ref" in
            v*)
              if [ "$ref" = "$locked" ]; then
                echo 'changed=false' >> "$GITHUB_OUTPUT"
                echo "$ref 已构建过，跳过"
              else
                echo 'changed=true' >> "$GITHUB_OUTPUT"
                echo "$ref 是新版本，开始构建"
              fi
              ;;
            *)
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              echo "$ref 是分支，直接构建"
              ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at ref
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -e
          git clone --depth 1 --branch "$REF" "$UPSTREAM_REPO" src
          cd src
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF=$REF" >> "$GITHUB_ENV"
          case "$REF" in
            v*) echo "TAG=$REF" >> "$GITHUB_ENV" ;;
            *)  echo "TAG=custom-$REF-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV" ;;
          esac
          echo "upstream: $REF $(git log -1 --format=%h\ %s)"

      # 发版说明直接沿用上游那一版的，保证版本号与更新日志一致
      - name: Fetch upstream release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          upstream_name=$(gh api "repos/$UPSTREAM_SLUG/releases/tags/$REF" --jq .name 2>/dev/null || true)
          gh api "repos/$UPSTREAM_SLUG/releases/tags/$REF" --jq .body > upstream-body.md 2>/dev/null || true
          if [ -z "$upstream_name" ]; then upstream_name="Release ${REF#v}"; fi
          {
            echo "RELEASE_NAME=$upstream_name"
            echo "UPSTREAM_BODY_BYTES=$(wc -c < upstream-body.md 2>/dev/null || echo 0)"
          } >> "$GITHUB_ENV"
          echo "release name: $upstream_name"
          echo "upstream body bytes: $(wc -c < upstream-body.md 2>/dev/null || echo 0)"

      - name: Apply patches
        working-directory: src
        run: |
          set -e
          for p in ../patches/*.patch; do
            echo "applying $p"
            git apply --verbose "$p"
          done

      - name: Verify patches still cover every gate
        working-directory: src
        run: |
          set -e
          grep -q 'local-build-unrestricted' 'Plain Craft Launcher 2/Modules/Minecraft/RestrictedFeaturePolicy.cs' \
            || { echo '::error::region gate patch did not land'; exit 1; }
          grep -q '"SystemSystemUpdate", LauncherAutoUpdateBehavior.Disable' PCL.Core/App/Config.cs \
            || { echo '::error::auto-update default patch did not land'; exit 1; }
          n=$(grep -rn 'RegionPolicy\.Evaluate(' --include=*.cs . | grep -v '^\./PCL.Core.Test/' | wc -l)
          [ "$n" -eq 0 ] || { echo "::error::upstream added RegionPolicy.Evaluate call site(s) outside tests: $n"; exit 1; }
          grep -q 'McDownloadClient(' 'Plain Craft Launcher 2/Pages/PageDownload/ModDownloadLib.cs' \
            || { echo '::error::download entry point is gone upstream'; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: src
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ env.UPSTREAM_SHA }}
        run: |
          set -e
          dotnet publish 'Plain Craft Launcher 2/Plain Craft Launcher 2.csproj' \
            -p:Configuration=CI -p:Platform=x64 --self-contained true -o ../artifact

      - name: Stage artifact
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          set -e
          mkdir -p dist
          cp 'artifact/Plain Craft Launcher 2.exe' dist/PCL-CE-Custom-x64.exe
          ls -lh dist
          if [ -n "$CLIENT_ID" ]; then echo 'CLIENT_ID: set'; else echo 'CLIENT_ID: not set'; fi
          if [ -n "$CLIENT_ID" ]; then
            strings -el dist/PCL-CE-Custom-x64.exe | grep -qF "$CLIENT_ID" \
              && echo 'client id found in binary' \
              || echo '::warning::CLIENT_ID 已配置但未在产物中找到，检查 PCL_WRITE_SECRET 与 env 变量名'
          fi
          {
            echo "> **本版基于上游 \`$UPSTREAM_REF\`（提交 \`$(echo $UPSTREAM_SHA | cut -c1-7)\`）自行编译，解除了中国大陆地区的下载/安装限制，并默认关闭自动检查更新。**"
            echo ">"
            echo "> 构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，补丁：$(ls patches | tr '\n' ' ')"
            echo ""
            echo "---"
            echo ""
            cat upstream-body.md 2>/dev/null || true
          } > body.md
          head -6 body.md

      - uses: actions/upload-artifact@v4
        with:
          name: PCL-CE-Custom-x64
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: body.md
          files: dist/PCL-CE-Custom-x64.exe
          make_latest: true

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: '0'
        run: |
          set -e
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt > rels.json
          python3 - <<'PY' > delete.txt
          import json, datetime
          rels = json.load(open('rels.json'))
          now = datetime.datetime.now(datetime.timezone.utc)
          cut = now - datetime.timedelta(days=30)
          keep, months = set(), {}
          for r in rels:
              t = datetime.datetime.fromisoformat(r['publishedAt'].replace('Z', '+00:00'))
              if t >= cut:
                  keep.add(r['tagName'])
              else:
                  months.setdefault(t.strftime('%Y-%m'), []).append((t, r['tagName']))
          for items in months.values():
              items.sort()
              keep.add(items[-1][1])
          for r in rels:
              if r['tagName'] not in keep:
                  print(r['tagName'])
          PY
          echo '--- to delete ---'
          cat delete.txt
          while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$DRY_RUN" = '1' ]; then echo "[dry-run] would delete $tag"; continue; fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < delete.txt

  record:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lock file
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -e
          case "$REF" in v*) printf '%s\n' "$REF" > .github/upstream-lock.txt ;; *) echo '分支构建不写锁文件' ;; esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/upstream-lock.txt
          if git diff --cached --quiet; then
            echo '锁文件未变化'
          else
            git commit -m "chore(ci): upstream $REF built [skip ci]"
            git push origin HEAD:main
            echo "已记录 $REF"
          fi