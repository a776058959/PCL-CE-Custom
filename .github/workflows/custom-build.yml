name: Custom build

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 tag 或分支（留空 = 最新正式发版）'
        type: string
        required: false
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/upstream-lock.txt'
      - 'apiv2/**'

permissions:
  contents: write

concurrency:
  group: custom-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/PCL-Community/PCL-CE.git
  UPSTREAM_SLUG: PCL-Community/PCL-CE

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.cmp.outputs.ref }}
      tag: ${{ steps.cmp.outputs.tag }}
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream ref and compare with lock
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.ref }}
        run: |
          set -e
          if [ -n "$WANT" ]; then ref="$WANT"; else ref=$(gh api "repos/$UPSTREAM_SLUG/releases/latest" --jq .tag_name); fi
          locked=$(tr -d '[:space:]' < .github/upstream-lock.txt 2>/dev/null || true)
          case "$ref" in v*) tag="$ref" ;; *) tag="custom-$ref-$(date -u +%Y%m%d-%H%M)" ;; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "上游: $ref（tag: $tag）上次构建: ${locked:-无}"
          if [ "$ref" = "$locked" ]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; echo '已构建过，跳过';
          else echo 'changed=true' >> "$GITHUB_OUTPUT"; echo '需要构建'; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   selfcontained: false, suffix: '' }
          - { arch: x64,   selfcontained: true,  suffix: '-bundled' }
          - { arch: arm64, selfcontained: false, suffix: '' }
          - { arch: arm64, selfcontained: true,  suffix: '-bundled' }
    name: build-${{ matrix.arch }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream at ref
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -e
          git clone --depth 1 --branch "$REF" "$UPSTREAM_REPO" src
          cd src && echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply patches
        working-directory: src
        run: |
          set -e
          for p in ../patches/*.patch; do echo "applying $p"; git apply --verbose "$p"; done

      - name: Verify patches still cover every gate
        working-directory: src
        run: |
          set -e
          grep -q 'local-build-unrestricted' 'Plain Craft Launcher 2/Modules/Minecraft/RestrictedFeaturePolicy.cs' \
            || { echo '::error::region gate patch did not land'; exit 1; }
          grep -q 'raw.githubusercontent.com/a776058959/PCL-CE-Custom' 'Plain Craft Launcher 2/Modules/Updates/UpdateManager.cs' \
            || { echo '::error::update source patch did not land'; exit 1; }
          n=$(grep -rn 'RegionPolicy\.Evaluate(' --include=*.cs . | grep -v '^\./PCL.Core.Test/' | wc -l)
          [ "$n" -eq 0 ] || { echo "::error::RegionPolicy.Evaluate call sites outside tests: $n"; exit 1; }
          grep -q 'McDownloadClient(' 'Plain Craft Launcher 2/Pages/PageDownload/ModDownloadLib.cs' \
            || { echo '::error::download entry point is gone upstream'; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        working-directory: src
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_GITHUB_SHA: ${{ env.UPSTREAM_SHA }}
          SELF: ${{ matrix.selfcontained }}
        run: |
          set -e
          if [ "$SELF" = "true" ]; then SC='--self-contained true'; else SC='--no-self-contained'; fi
          dotnet publish 'Plain Craft Launcher 2/Plain Craft Launcher 2.csproj' \
            -p:Configuration=Release -p:Platform=${{ matrix.arch }} $SC -o ../artifact

      - name: Stage exe
        env:
          FILE: PCL-CE-Custom-${{ needs.check.outputs.tag }}-${{ matrix.arch }}${{ matrix.suffix }}.exe
        run: |
          set -e
          mkdir -p out
          cp 'artifact/Plain Craft Launcher 2.exe' "out/$FILE"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}${{ matrix.suffix }}
          path: out/

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Fetch upstream release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          name=$(gh api "repos/$UPSTREAM_SLUG/releases/tags/$REF" --jq .name 2>/dev/null || true)
          gh api "repos/$UPSTREAM_SLUG/releases/tags/$REF" --jq .body > upstream-body.md 2>/dev/null || true
          if [ -z "$name" ]; then name="Release ${REF#v}"; fi
          curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM_SLUG/$REF/Plain%20Craft%20Launcher%202/metadata.json" -o meta.json || true
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"

      - name: Assemble dist
        env:
          TAG: ${{ needs.check.outputs.tag }}
          REF: ${{ needs.check.outputs.ref }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          set -e
          mkdir -p dist
          find collected -name '*.exe' -exec cp {} dist/ \;
          ls -lh dist
          if [ -n "$CLIENT_ID" ]; then echo 'CLIENT_ID: set'; else echo 'CLIENT_ID: not set'; fi
          for f in dist/*.exe; do
            if [ -n "$CLIENT_ID" ] && strings -el "$f" | grep -qF "$CLIENT_ID"; then echo "client id ok: $(basename "$f")"; fi
          done
          (cd dist && zip -j "PCL-CE-Custom-$TAG-x64.zip" "PCL-CE-Custom-$TAG-x64.exe")
          (cd dist && zip -j "PCL-CE-Custom-$TAG-arm64.zip" "PCL-CE-Custom-$TAG-arm64.exe")
          ls -lh dist
          {
            echo "> **本版基于上游 \`$REF\` 自行编译，解除了中国大陆地区的下载/安装限制。更新由本仓库提供，不是官方发布。**"
            echo ">"
            echo "> 构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，补丁：$(ls patches | tr '\n' ' ')"
            echo ">"
            echo "> 每个架构两种：不带后缀的需要机器装有 [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)（约 22 MB）；带 \`-bundled\` 的自带运行时（约 190 MB），拷到没装运行时的机器也能直接跑。"
            echo ""
            echo "---"
            echo ""
            grep -v -i 'mirror 酱\|mirrorchyan\|你也可以直接在下方' upstream-body.md 2>/dev/null || true
          } > body.md
          head -8 body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ env.RELEASE_NAME }}
          body_path: body.md
          files: |
            dist/*.exe
            dist/*.zip
          make_latest: true

      - name: Remove stale assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -e
          for n in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$n" in
              *.sigstore.json) continue ;;
              PCL-CE-Custom-$TAG-*) continue ;;
            esac
            echo "删除陈旧资产 $n"
            gh release delete-asset "$TAG" "$n" --repo "$GITHUB_REPOSITORY" --yes
          done

      - name: Write update metadata
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -e
          X64_SHA=$(sha256sum "dist/PCL-CE-Custom-$TAG-x64.exe" | cut -d' ' -f1)
          ARM_SHA=$(sha256sum "dist/PCL-CE-Custom-$TAG-arm64.exe" | cut -d' ' -f1)
          echo "x64=$X64_SHA"; echo "arm64=$ARM_SHA"
          REF="${{ needs.check.outputs.ref }}" X64_SHA="$X64_SHA" ARM_SHA="$ARM_SHA" python3 - <<'PY'
          import json, os, hashlib, pathlib
          try:
              meta = json.load(open('meta.json', encoding='utf-8'))['version']
              name = meta['base'] + (('-' + meta['suffix']) if meta.get('suffix') else '')
              code = meta['code']
          except FileNotFoundError:
              name = os.environ.get('REF', '').lstrip('v')
              code = 0
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['TAG']
          try:
              changelog = open('upstream-body.md', encoding='utf-8').read()
          except FileNotFoundError:
              changelog = ''
          upd_dir = pathlib.Path('apiv2/updates'); upd_dir.mkdir(parents=True, exist_ok=True)
          cache = {}
          for arch, sha in (('x64', os.environ['X64_SHA']), ('arm64', os.environ['ARM_SHA'])):
              zip_name = 'PCL-CE-Custom-%s-%s.zip' % (tag, arch)
              asset = {
                  'file_name': zip_name,
                  'version': {'channel': 'stable', 'name': name, 'code': code},
                  'upd_time': tag,
                  'downloads': ['https://github.com/%s/releases/download/%s/%s' % (repo, tag, zip_name)],
                  'patches': [],
                  'sha256': sha,
                  'changelog': changelog,
              }
              f = upd_dir / ('updates-sr%s.json' % arch)
              f.write_text(json.dumps({'assets': [asset]}, ensure_ascii=False, indent=2), encoding='utf-8')
              cache['updates-sr%s' % arch] = hashlib.md5(f.read_bytes()).hexdigest()
          ann = pathlib.Path('apiv2/announcement.json')
          ann.write_text(json.dumps({'content': []}, ensure_ascii=False), encoding='utf-8')
          cache['announcement'] = hashlib.md5(ann.read_bytes()).hexdigest()
          pathlib.Path('apiv2/cache.json').write_text(json.dumps(cache, indent=2), encoding='utf-8')
          print('version:', name, 'code:', code)
          print('cache:', cache)
          PY

      - name: Commit update metadata
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apiv2
          if git diff --cached --quiet; then echo '元数据无变化'; else
            git commit -m "chore(update): $TAG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt > rels.json
          python3 - <<'PY' > delete.txt
          import json, datetime
          rels = json.load(open('rels.json'))
          now = datetime.datetime.now(datetime.timezone.utc)
          cut = now - datetime.timedelta(days=30)
          keep, months = set(), {}
          for r in rels:
              t = datetime.datetime.fromisoformat(r['publishedAt'].replace('Z', '+00:00'))
              if t >= cut:
                  keep.add(r['tagName'])
              else:
                  months.setdefault(t.strftime('%Y-%m'), []).append((t, r['tagName']))
          for items in months.values():
              items.sort()
              keep.add(items[-1][1])
          for r in rels:
              if r['tagName'] not in keep:
                  print(r['tagName'])
          PY
          cat delete.txt
          while read -r t; do
            [ -z "$t" ] && continue
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < delete.txt

  record:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lock file
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -e
          case "$REF" in v*) printf '%s\n' "$REF" > .github/upstream-lock.txt ;; *) echo '分支构建不写锁文件' ;; esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/upstream-lock.txt
          if git diff --cached --quiet; then echo '锁文件未变化'; else
            git commit -m "chore(ci): upstream $REF built [skip ci]"
            git push origin HEAD:main
          fi